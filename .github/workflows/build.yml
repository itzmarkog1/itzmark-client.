
package com.itzmark.client;

import net.minecraft.client.Minecraft;
import net.minecraft.client.gui.GuiGraphics;
import net.minecraft.client.gui.screens.Screen;
import net.minecraft.client.gui.screens.options.OptionsScreen;
import net.minecraft.network.chat.Component;

public class ItzMarkHomeScreen extends Screen {

    private final Screen parent;

    public ItzMarkHomeScreen(Screen parent) {
        super(Component.literal("itzMark Client"));
        this.parent = parent;
    }

    @Override
    protected void init() {
        int centerX = this.width / 2;
        int centerY = this.height / 2;

        int buttonWidth = 200;
        int buttonHeight = 20;
        int gap = 25;

        int startY = centerY - 70;

        // Singleplayer
        this.addRenderableWidget(
            net.minecraft.client.gui.components.Button.builder(
                Component.literal("Singleplayer"),
                button -> Minecraft.getInstance().setScreen(
                    new net.minecraft.client.gui.screens.worldselection.SelectWorldScreen(this)
                )
            ).bounds(centerX - buttonWidth / 2, startY, buttonWidth, buttonHeight).build()
        );

        // Multiplayer
        this.addRenderableWidget(
            net.minecraft.client.gui.components.Button.builder(
                Component.literal("Multiplayer"),
                button -> Minecraft.getInstance().setScreen(
                    new net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen(this)
                )
            ).bounds(centerX - buttonWidth / 2, startY + gap, buttonWidth, buttonHeight).build()
        );

        // Settings
        this.addRenderableWidget(
            net.minecraft.client.gui.components.Button.builder(
                Component.literal("Settings"),
                button -> Minecraft.getInstance().setScreen(
                    new OptionsScreen(this, Minecraft.getInstance().options)
                )
            ).bounds(centerX - buttonWidth / 2, startY + gap * 2, buttonWidth, buttonHeight).build()
        );

        // Back
        this.addRenderableWidget(
            net.minecraft.client.gui.components.Button.builder(
                Component.literal("Back"),
                button -> Minecraft.getInstance().setScreen(parent)
            ).bounds(centerX - buttonWidth / 2, startY + gap * 3, buttonWidth, buttonHeight).build()
        );
    }

    @Override
    public void render(
        GuiGraphics graphics,
        int mouseX,
        int mouseY,
        float partialTick
    ) {
        this.renderBackground(graphics, mouseX, mouseY, partialTick);

        int centerX = this.width / 2;

        graphics.drawCenteredString(
            this.font,
            "itzMark Client",
            centerX,
            this.height / 2 - 115,
            0xFF00FFFF
        );

        graphics.drawCenteredString(
            this.font,
            "Welcome to itzMark Client!",
            centerX,
            this.height / 2 - 95,
            0xFFFFFFFF
        );

        super.render(graphics, mouseX, mouseY, partialTick);
    }

    @Override
    public boolean isPauseScreen() {
        return false;
    }
}

