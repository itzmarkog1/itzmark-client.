
name: Build itzMark Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build itzMark Client
        working-directory: itzmark-client-fabric-1.21.11-github-build/itzmark-client
        run: gradle --no-daemon clean build

      - name: Upload Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: itzMark-Client-Fabric-1.21.11
          path: itzmark-client-fabric-1.21.11-github-build/itzmark-client/build/libs/*.jar
          if-no-files-found: error

